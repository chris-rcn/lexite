<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexite - Word Game</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>

  <header>
    <div id="header-left">
      <h1>Lexite</h1>
    </div>
    <div id="scoreboard">
      <div class="score-block">
        <div class="score-label">You</div>
        <div class="score-value" id="player-score">0</div>
      </div>
      <div class="score-divider">vs</div>
      <div class="score-block">
        <div class="score-label">Computer</div>
        <div class="score-value" id="computer-score">0</div>
      </div>
    </div>
    <div id="header-right">
      <button id="btn-new-game">New Game</button>
    </div>
  </header>

  <main>
    <div id="board-container">
      <div id="board">
        <!-- 225 cells generated by game.js -->
      </div>
      <!-- Live score preview bubble (anchored to the board so it scrolls with it) -->
      <div id="score-bubble" class="hidden"></div>
    </div>

    <aside id="sidebar">
      <div id="bag-info">
        <span id="bag-info-unseen">93 unseen tiles</span><span id="bag-info-bag"> (86 in bag)</span>
      </div>

      <div id="rack-section">
        <div id="rack">
          <!-- tiles rendered by game.js -->
        </div>
      </div>

      <div id="action-buttons">
        <div class="action-row">
          <button id="btn-lifeline">Play Lifeline</button>
          <button id="btn-recall">Recall Tiles</button>
          <button id="btn-shuffle">Shuffle Rack</button>
        </div>
        <div class="action-row">
          <button id="btn-exchange">Swap Tiles</button>
          <button id="btn-play" class="btn-primary">Play Word</button>
        </div>
      </div>
      <div id="exchange-bar" class="hidden">
        <span id="exchange-hint">Select tiles to swap</span>
        <button id="exchange-confirm" disabled>Swap (0)</button>
        <button id="exchange-cancel">Cancel</button>
      </div>

      <div id="move-log-section">
        <div class="section-label">Move History</div>
        <div id="move-log"></div>
      </div>
    </aside>
  </main>

  <!-- Unseen tiles dialog -->
  <div id="unseen-overlay" class="hidden">
    <div id="unseen-dialog">
      <div id="unseen-grid"></div>
      <button id="unseen-close">Close</button>
    </div>
  </div>

  <!-- Blank tile letter chooser -->
  <div id="blank-overlay" class="hidden">
    <div id="blank-dialog">
      <div id="blank-dialog-title">Choose a letter for your blank tile</div>
      <div id="blank-letter-grid">
        <!-- 26 buttons built by game.js -->
      </div>
      <button id="blank-cancel">Cancel</button>
    </div>
  </div>

  <!-- Pass confirmation -->
  <div id="pass-overlay" class="hidden">
    <div id="pass-dialog">
      <div id="pass-title">Pass your turn?</div>
      <div id="pass-text">You have no tiles placed.</div>
      <div id="pass-buttons">
        <button id="pass-confirm">Pass</button>
        <button id="pass-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- New game confirmation -->
  <div id="newgame-overlay" class="hidden">
    <div class="confirm-dialog">
      <div class="confirm-title">Start a new game?</div>
      <div class="confirm-text">The current game will be lost.</div>
      <div class="confirm-buttons">
        <button id="newgame-confirm">New Game</button>
        <button id="newgame-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- End-game overlay -->
  <div id="end-overlay" class="hidden">
    <div id="end-dialog">
      <div id="end-title">Game Over</div>
      <div id="end-scores"></div>
      <div id="end-winner"></div>
      <button id="btn-play-again">Play Again</button>
      <button id="end-close">View Board</button>
    </div>
  </div>

  <!-- Invalid-move error toast -->
  <div id="error-toast" class="hidden"></div>

  <script src="game.js"></script>
  <footer id="build-stamp"></footer>
  <script>
    var d = new Date(document.lastModified);
    document.getElementById('build-stamp').textContent =
      'built ' + d.getUTCFullYear() + '-' +
      String(d.getUTCMonth()+1).padStart(2,'0') + '-' +
      String(d.getUTCDate()).padStart(2,'0') + ' ' +
      String(d.getUTCHours()).padStart(2,'0') + ':' +
      String(d.getUTCMinutes()).padStart(2,'0') + ' UTC';
  </script>
</body>
</html>
